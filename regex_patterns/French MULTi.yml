name: French MULTi
pattern: '(?i)(?<=^|[\s.-])(?:MULTI(?:[ ._-]?(?:VFI|VFF|VFQ|VF2|VFQ2|VFF2|VFI2|\d+))?|FR\s*\+\s*[A-Z]{2}|[A-Z]{2}\s*\+\s*FR)(?![ ._-]?SUBS?)(?=$|[\s.-])'
description: Matches French scene-style MULTi releases and FR+XX language-pair tags.
tags:
- Language
- French
tests:
- expected: true
  id: 1
  input: Film.2024.MULTi.1080p.WEB-DL.DDP5.1.H264-GROUP
- expected: true
  id: 2
  input: Serie.S01E01.MULTi20.2160p.WEB.H265-GROUP
- expected: false
  id: 3
  input: Movie.2024.VF.1080p.BluRay.x264-GROUP
- expected: false
  id: 4
  input: We.Dont.Die.We.Multiply.2024.1080p.WEB-DL.H264-GROUP
- expected: true
  id: 5
  input: Film.2024.MULTi.VFF.1080p.WEB-DL.H264-GROUP
- expected: true
  id: 6
  input: Film.2024.FR+EN.1080p.WEB-DL.H264-GROUP
- expected: true
  id: 7
  input: Film.2024.EN+FR.1080p.WEB-DL.H264-GROUP
- expected: false
  id: 8
  input: Film.2024.MULTi.SUBS.1080p.WEB-DL.H264-GROUP
