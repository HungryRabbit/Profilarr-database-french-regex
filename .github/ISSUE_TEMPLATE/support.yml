name: Support
description: Demander de l'aide pour utiliser la database avec Profilarr, Radarr ou Sonarr
title: "[Support]: "
labels: ["type: support"]

body:
  - type: dropdown
    id: tool
    attributes:
      label: Outil concerne
      options:
        - Profilarr
        - Radarr
        - Sonarr
        - GitHub / repository
        - Autre
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Question
      placeholder: "Explique ce que tu veux faire ou ce qui bloque."
    validations:
      required: true

  - type: textarea
    id: setup
    attributes:
      label: Configuration utile
      description: Indique le profil, la source GitHub/branche, Radarr/Sonarr, et les captures si utile.
      placeholder: "Profil utilise, branche, application concernee, message d'erreur..."

  - type: textarea
    id: tried
    attributes:
      label: Ce que tu as deja essaye
      placeholder: "Sync Profilarr, suppression des CF, changement de profil, etc."
