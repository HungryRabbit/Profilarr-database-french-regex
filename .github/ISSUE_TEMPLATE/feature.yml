name: Feature Request
description: Proposer une nouvelle fonctionnalite ou une amelioration
title: "[Feature]: "
labels: ["type: feature"]

body:
  - type: textarea
    id: request
    attributes:
      label: Quoi ajouter ?
      placeholder: "Decris la fonctionnalite ou l'amelioration souhaitee."
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Pourquoi c'est utile ?
      placeholder: "Explique le cas d'usage et le probleme que ca resout."
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Zone concernee
      options:
        - Regex
        - Custom Formats
        - Profiles
        - Anime
        - Media Management
        - Documentation
        - Autre
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References
      description: Liens vers TRaSH, Dictionarry, un repo FR, une release exemple ou une discussion.
      placeholder: "https://..."
