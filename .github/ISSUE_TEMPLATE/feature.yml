name: Feature Request
description: Proposer une nouvelle fonctionnalité ou une amélioration
title: "[Feature]: "
labels: ["type: feature"]

body:
  - type: textarea
    id: request
    attributes:
      label: Quoi ajouter ?
      placeholder: "Décris la fonctionnalité ou l'amélioration souhaitée."
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Pourquoi c'est utile ?
      placeholder: "Explique le cas d'usage et le problème que ça résout."
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Zone concernée
      options:
        - Regex
        - Custom Formats
        - Profiles
        - Anime
        - Media Management
        - Documentation
        - Autre
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: Références
      description: Liens vers TRaSH, Dictionarry, un repo FR, une release exemple ou une discussion.
      placeholder: "https://..."
