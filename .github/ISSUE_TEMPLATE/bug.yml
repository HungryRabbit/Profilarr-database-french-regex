name: Bug
description: Signaler un problème de regex, custom format, profil ou scoring
title: "[Bug]: "
labels: ["type: bug"]

body:
  - type: dropdown
    id: area
    attributes:
      label: Zone concernée
      options:
        - Regex
        - Custom Format
        - Profile
        - Media Management
        - Documentation
        - Autre
    validations:
      required: true

  - type: input
    id: item
    attributes:
      label: Élément concerné
      placeholder: "Ex: French MULTi, FR Global Tier 01, 1080p Efficient FR"
    validations:
      required: true

  - type: textarea
    id: release
    attributes:
      label: Release concernée
      description: Colle le nom complet de la release si le bug concerne un match ou un score.
      placeholder: "Ex: Movie.2026.MULTI.VFF.1080p.WEB.H264-GROUP"
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Résultat attendu
      placeholder: "Ex: La release devrait matcher French MULTi et FR Global Tier 01."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Résultat actuel
      placeholder: "Ex: La release ne match aucun CF de langue."
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Contexte
      description: Ajoute des captures Radarr/Sonarr/Profilarr ou un lien Regex101 si utile.
      placeholder: "Captures, profil utilisé, score obtenu, logs utiles..."
